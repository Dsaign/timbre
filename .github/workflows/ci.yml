name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      # Ignored advisories live in front/pnpm-workspace.yaml (auditConfig).
      - run: pnpm audit --audit-level moderate
      - run: ../scripts/check-openapi-drift.sh

  back:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pyright
      - name: pip-audit
        run: |
          uv export --locked --format requirements.txt --no-emit-project -q -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  # pytest and Playwright against the Compose stack, then Trivy on the built image.
  stack:
    runs-on: ubuntu-24.04
    env:
      # Every docker compose command below runs the test stack (raised rate limits).
      COMPOSE_FILE: compose.yaml:compose.test.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write throwaway back/.env
        working-directory: back
        # Empty on Dependabot and fork PRs: Preview is then "not available" and its e2e test skips.
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          for k in POSTGRES_PASSWORD ML_WORKER_PASSWORD API_SEARCH_PASSWORD API_PREVIEW_PASSWORD IP_HASH_SALT FRONT_TOKEN; do
            v="$(openssl rand -hex 32)"
            echo "::add-mask::$v"
            echo "$k=$v"
          done > .env
          echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" >> .env
          echo "SPOTIFY_CLIENT_SECRET=$SPOTIFY_CLIENT_SECRET" >> .env
          echo "FRONT_TOKEN=$(grep '^FRONT_TOKEN=' .env | cut -d= -f2)" >> "$GITHUB_ENV"
      # Builds every image (tests too) and boots the stack in the background, overlapping the
      # front install below; "Wait for the stack" collects its log and exit code.
      - name: Start the stack in the background
        working-directory: back
        run: |
          (set +e; docker compose --profile test build && docker compose up -d --wait
           echo $? > "$RUNNER_TEMP/stack.exit") > "$RUNNER_TEMP/stack.log" 2>&1 &
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - name: Install front and browsers
        working-directory: front
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Wait for the stack
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/stack.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/stack.log"
          exit "$(cat "$RUNNER_TEMP/stack.exit")"
      - name: pytest
        working-directory: back
        run: docker compose run --rm tests
      - name: Playwright
        working-directory: front
        env:
          BACK_URL: http://127.0.0.1:8000
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }} # e2e/preview.spec.ts skips without it
        run: pnpm test:e2e
      - name: Compose logs
        if: failure()
        working-directory: back
        run: docker compose logs
      - name: Trivy (api image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: back-api
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Same gitleaks version as the pre-commit hook; scans the full history.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact
