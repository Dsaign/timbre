name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      # Ignored advisories live in front/pnpm-workspace.yaml (auditConfig).
      - run: pnpm audit --audit-level moderate
      - run: ../scripts/check-openapi-drift.sh

  back:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pyright
      - name: pip-audit
        run: |
          uv export --locked --format requirements.txt --no-emit-project -q -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  # pytest and Playwright against the Compose stack, then Trivy on the built image.
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # a normal run takes about 5 minutes
    env:
      # Every docker compose command below runs the test stack (raised rate limits, its own fresh in-memory db and models volume).
      COMPOSE_FILE: compose.yaml:compose.test.yaml
      # Playwright's official image: browsers and their system libraries, no apt or browser download in CI.
      # Its tag must match @playwright/test in front/pnpm-lock.yaml ("Playwright version" checks it).
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write throwaway back/.env
        working-directory: back
        # Empty on Dependabot and fork PRs: Preview is then "not available" and its e2e test skips.
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          for k in POSTGRES_PASSWORD ML_WORKER_PASSWORD API_SEARCH_PASSWORD API_PREVIEW_PASSWORD IP_HASH_SALT FRONT_TOKEN; do
            v="$(openssl rand -hex 32)"
            echo "::add-mask::$v"
            echo "$k=$v"
          done > .env
          echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" >> .env
          echo "SPOTIFY_CLIENT_SECRET=$SPOTIFY_CLIENT_SECRET" >> .env
          echo "FRONT_TOKEN=$(grep '^FRONT_TOKEN=' .env | cut -d= -f2)" >> "$GITHUB_ENV"
      # Builds every image (tests too) and boots the stack in the background, overlapping the
      # front install below; "Wait for the stack" collects its log and exit code. The Playwright
      # image is pulled alongside; `docker run` finishes any pull still in progress.
      - name: Start the stack in the background
        working-directory: back
        run: |
          (set +e; docker compose --profile test build && docker compose up -d --wait
           echo $? > "$RUNNER_TEMP/stack.exit") > "$RUNNER_TEMP/stack.log" 2>&1 &
          docker pull -q "$PLAYWRIGHT_IMAGE" > "$RUNNER_TEMP/playwright-pull.log" 2>&1 &
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - name: Playwright version
        run: |
          v="$(sed -n "s/^  '@playwright\/test@\(.*\)':$/\1/p" front/pnpm-lock.yaml | head -1)"
          test -n "$v"
          case "$PLAYWRIGHT_IMAGE" in
            *":v$v-noble@"*) ;;
            *) echo "::error::PLAYWRIGHT_IMAGE does not match @playwright/test $v"; exit 1 ;;
          esac
      # On the host: the image is the same Ubuntu 24.04 x64 (glibc) as the runner, so native
      # packages (Next's SWC, lightningcss) resolve for both, and pnpm's store cache stays here.
      - name: Install front
        working-directory: front
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Wait for the stack
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/stack.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/stack.log"
          exit "$(cat "$RUNNER_TEMP/stack.exit")"
      - name: pytest
        working-directory: back
        run: docker compose run --rm tests
      # In the Playwright image, with the host network (the Compose stack, next start on :3000).
      # Node 26 comes from the image (same major as setup-node); the runner's pnpm is mounted read-only
      # at its host path (a global install would need root). Same uid as the runner: test-results stay
      # readable for upload. Forwards every env var the front and tests read.
      - name: Playwright
        timeout-minutes: 15
        env:
          BACK_URL: http://127.0.0.1:8000
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }} # e2e/preview.spec.ts skips without it
        run: |
          pnpm_dir="$(dirname "$(command -v pnpm)")"
          docker run --rm --init --ipc=host --network host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CI -e BACK_URL -e FRONT_TOKEN -e SPOTIFY_CLIENT_ID \
            -e PATH="$pnpm_dir:/usr/local/bin:/usr/bin:/bin" \
            -v "$HOME:$HOME:ro" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE/front" \
            "$PLAYWRIGHT_IMAGE" pnpm test:e2e
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: front/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Compose logs
        if: failure()
        working-directory: back
        run: docker compose logs
      - name: Trivy (api image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: back-api
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Same gitleaks version as the pre-commit hook; scans the full history.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact
