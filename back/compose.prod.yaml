# Production on the VPS: `docker compose -f compose.yaml -f compose.prod.yaml up -d --wait --build`
# (or COMPOSE_FILE=compose.yaml:compose.prod.yaml in back/.env). Only Caddy is published.
services:
  db:
    restart: unless-stopped

  api:
    restart: unless-stopped
    ports: !reset [] # reached only through Caddy
    environment:
      APP_ENV: production # API docs stay off whatever back/.env says

  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # ports 80 and 443
    security_opt: ["no-new-privileges:true"]
    read_only: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN:?set in back/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep, or Let's Encrypt rate limits bite on re-issue
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
