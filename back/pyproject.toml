[project]
name = "timbre-back"
version = "0.1.0"
description = "timbre back end: FastAPI service and SQL migrations"
authors = [
    { name = "dsaign", email = "fsampaio.souza@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "onnxruntime>=1.31.1",
    "psycopg[binary,pool]>=3.3.6",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# S = flake8-bandit, which includes S608 (SQL built from strings).
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["onnxruntime"] # ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
